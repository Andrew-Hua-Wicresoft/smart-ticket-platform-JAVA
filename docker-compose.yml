services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhigong}
      POSTGRES_USER: ${POSTGRES_USER:-zhigong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./platform-java/platform-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./platform-java/platform-service/src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhigong"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v3.0.3
    profiles:
      - governance
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.9
    profiles:
      - governance
    ports:
      - "8858:8858"
      - "8719:8719"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8858 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhigong}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-zhigong}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  platform-service:
    build:
      context: .
      dockerfile: platform-java/platform-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zhigong}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-zhigong}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SQL_INIT_MODE: always
      AI_SERVICE_URL: http://ai-service:8100
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      SENTINEL_DASHBOARD: ${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: platform-java/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PLATFORM_SERVICE_URL: http://platform-service:8081
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_RESPONSE_TIMEOUT: 45s
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      SENTINEL_DASHBOARD: ${SENTINEL_DASHBOARD:-sentinel-dashboard:8858}
    depends_on:
      platform-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    profiles:
      - frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres_data:
