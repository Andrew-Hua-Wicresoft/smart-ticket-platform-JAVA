name: Container Images

on:
  pull_request:
    paths:
      - ai-service/**
      - frontend/**
      - platform-java/**
      - pom.xml
      - .mvn/**
      - .github/workflows/container-images.yml
  push:
    branches:
      - main
    paths:
      - ai-service/**
      - frontend/**
      - platform-java/**
      - pom.xml
      - .mvn/**
      - .github/workflows/container-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: andrew-hua-wicresoft/smart-ticket-platform-java

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
          - name: gateway
            context: .
            dockerfile: ./platform-java/gateway/Dockerfile
          - name: platform-service
            context: .
            dockerfile: ./platform-java/platform-service/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:latest
