name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/**
      - feat/**
      - fix/**

permissions:
  contents: read

jobs:
  java:
    name: Java services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Java tests
        run: mvn -s .mvn/settings.xml -pl platform-java/platform-service,platform-java/gateway test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  python:
    name: AI service syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile ai-service/main.py
