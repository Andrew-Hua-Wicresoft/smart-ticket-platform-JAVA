spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:45s}
          routes:
            - id: platform-service-v1
              uri: ${PLATFORM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**
              filters:
                - RewritePath=/api/v1/?(?<segment>.*), /api/${segment}
            - id: platform-service-legacy
              uri: ${PLATFORM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
