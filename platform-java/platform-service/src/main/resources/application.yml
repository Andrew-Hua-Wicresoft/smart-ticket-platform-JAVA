spring:
  application:
    name: platform-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zhigong}
    username: ${SPRING_DATASOURCE_USERNAME:zhigong}
    password: ${SPRING_DATASOURCE_PASSWORD:zhigong123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24 hours

llm:
  provider: ${LLM_PROVIDER:anthropic}
  api-key: ${LLM_API_KEY:${CLAUDE_API_KEY:}}
  model: ${LLM_MODEL:claude-sonnet-4-20250514}
  base-url: ${LLM_BASE_URL:}
  providers:
    anthropic:
      base-url: ${ANTHROPIC_API_URL:https://api.anthropic.com/v1/messages}
    openai:
      base-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
    deepseek:
      base-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}

embedding:
  sidecar:
    url: ${EMBEDDING_SIDECAR_URL:http://localhost:8100}

server:
  port: 8081
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticket.zhigong: INFO
    org.springframework.security: WARN
  pattern:
    level: "%5p [request:%X{requestId:-}]"
