spring:
  application:
    name: platform-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zhigong}
    username: ${SPRING_DATASOURCE_USERNAME:zhigong}
    password: ${SPRING_DATASOURCE_PASSWORD:zhigong123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ai:
  service:
    url: ${AI_SERVICE_URL:${EMBEDDING_SIDECAR_URL:http://localhost:8100}}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24 hours

embedding:
  sidecar:
    url: ${EMBEDDING_SIDECAR_URL:http://localhost:8100}

server:
  port: 8081
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ticket.zhigong: INFO
    org.springframework.security: WARN
  pattern:
    level: "%5p [request:%X{requestId:-}]"
