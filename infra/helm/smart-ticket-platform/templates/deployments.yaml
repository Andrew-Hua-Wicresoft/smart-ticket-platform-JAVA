{{- $root := . -}}
{{- $apps := dict
  "frontend" .Values.frontend
  "gateway" .Values.gateway
  "platform-service" .Values.platformService
  "ai-service" .Values.aiService
-}}
{{- range $name, $app := $apps }}
{{- if $app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "smart-ticket.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/part-of: smart-ticket-platform
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "smart-ticket.image" (dict "registry" $root.Values.imageRegistry "image" $app.image "tag" $app.tag) }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          {{- if ne $name "frontend" }}
          envFrom:
            - configMapRef:
                name: smart-ticket-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: JWT_SECRET
                  optional: true
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.secrets.name }}
                  key: AI_API_KEY
                  optional: true
            {{- if eq $name "ai-service" }}
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $app.healthPath }}
              port: http
            initialDelaySeconds: {{ ternary 10 40 (eq $name "frontend") }}
            periodSeconds: 10
---
{{- end }}
{{- end }}
