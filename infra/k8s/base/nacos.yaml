apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nacos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nacos
        app.kubernetes.io/part-of: smart-ticket-platform
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.0.3
          ports:
            - containerPort: 8848
              name: http
            - containerPort: 9848
              name: grpc
          env:
            - name: MODE
              value: standalone
            - name: PREFER_HOST_MODE
              value: hostname
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JVM_XMS
              value: 512m
            - name: JVM_XMX
              value: 512m
            - name: JVM_XMN
              value: 256m
          readinessProbe:
            httpGet:
              path: /nacos/actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  ports:
    - name: http
      port: 8848
      targetPort: http
    - name: grpc
      port: 9848
      targetPort: grpc
  selector:
    app.kubernetes.io/name: nacos
