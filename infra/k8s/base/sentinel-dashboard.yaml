apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  labels:
    app.kubernetes.io/name: sentinel-dashboard
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-dashboard
        app.kubernetes.io/part-of: smart-ticket-platform
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.9
          ports:
            - containerPort: 8858
              name: http
            - containerPort: 8719
              name: transport
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  labels:
    app.kubernetes.io/name: sentinel-dashboard
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  ports:
    - name: http
      port: 8858
      targetPort: http
    - name: transport
      port: 8719
      targetPort: transport
  selector:
    app.kubernetes.io/name: sentinel-dashboard
