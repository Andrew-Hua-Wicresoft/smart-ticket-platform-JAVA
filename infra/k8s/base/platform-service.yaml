apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service
  labels:
    app.kubernetes.io/name: platform-service
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-service
        app.kubernetes.io/part-of: smart-ticket-platform
    spec:
      containers:
        - name: platform-service
          image: smart-ticket-platform/platform-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: smart-ticket-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-ticket-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-ticket-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: platform-service
  labels:
    app.kubernetes.io/name: platform-service
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  ports:
    - port: 8081
      targetPort: http
  selector:
    app.kubernetes.io/name: platform-service
