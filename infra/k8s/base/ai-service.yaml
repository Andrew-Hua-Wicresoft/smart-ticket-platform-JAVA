apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: smart-ticket-platform
    spec:
      containers:
        - name: ai-service
          image: smart-ticket-platform/ai-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
              name: http
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-ticket-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: EMBEDDING_MODEL
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: AI_MODEL
            - name: AI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: AI_BASE_URL
            - name: AI_REQUEST_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: smart-ticket-config
                  key: AI_REQUEST_TIMEOUT_SECONDS
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-ticket-secrets
                  key: AI_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: smart-ticket-platform
spec:
  ports:
    - port: 8100
      targetPort: http
  selector:
    app.kubernetes.io/name: ai-service
