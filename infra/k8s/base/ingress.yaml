apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-ticket
  labels:
    app.kubernetes.io/name: smart-ticket-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: smart-ticket.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
