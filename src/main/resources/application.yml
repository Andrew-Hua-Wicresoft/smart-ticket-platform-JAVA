spring:
  application:
    name: zhigong
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/zhigong}
    username: ${SPRING_DATASOURCE_USERNAME:zhigong}
    password: ${SPRING_DATASOURCE_PASSWORD:zhigong123}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000  # 24 hours

claude:
  api-key: ${CLAUDE_API_KEY:}
  model: claude-sonnet-4-20250514

embedding:
  sidecar:
    url: http://localhost:8100

server:
  port: 8080

logging:
  level:
    com.ticket.zhigong: INFO
    org.springframework.security: WARN
